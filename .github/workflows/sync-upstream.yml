# Daily merge of FabianFG/CUE4Parse master into our uepacktool-fixes branch.
# Merged result is pushed only when the managed build still succeeds; a merge
# conflict or a build failure opens (or updates) an issue instead of pushing.
name: Sync upstream

on:
  schedule:
    - cron: '0 20 * * *' # 04:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/FabianFG/CUE4Parse.git
  UPSTREAM_BRANCH: master
  TARGET_BRANCH: uepacktool-fixes

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Merge upstream
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          up=$(git rev-parse --short "upstream/$UPSTREAM_BRANCH")
          echo "upstream_sha=$up" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "already contains upstream/$UPSTREAM_BRANCH ($up)"
            echo "result=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(git rev-list --count "HEAD..upstream/$UPSTREAM_BRANCH")
          echo "behind=$n" >> "$GITHUB_OUTPUT"
          if git merge --no-ff --no-edit -m "Merge upstream/$UPSTREAM_BRANCH ($up, $n commits) into $TARGET_BRANCH" "upstream/$UPSTREAM_BRANCH"; then
            git submodule update --init --recursive
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            {
              echo '```'
              git diff --name-only --diff-filter=U
              echo '```'
            } > /tmp/conflicts.md
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.merge.outputs.result == 'merged'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build merged tree
        id: build
        if: steps.merge.outputs.result == 'merged'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet build CUE4Parse/CUE4Parse.csproj -c Release -nologo -clp:NoSummary 2>&1 | tee /tmp/build.log
          dotnet build CUE4Parse-Conversion/CUE4Parse-Conversion.csproj -c Release -nologo -clp:NoSummary 2>&1 | tee -a /tmp/build.log

      - name: Push merge
        if: steps.merge.outputs.result == 'merged' && steps.build.outcome == 'success'
        shell: bash
        run: git push origin "HEAD:$TARGET_BRANCH"

      - name: Report failure as an issue
        if: steps.merge.outputs.result == 'conflict' || steps.build.outcome == 'failure'
        uses: actions/github-script@v8
        env:
          RESULT: ${{ steps.merge.outputs.result }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
          BEHIND: ${{ steps.merge.outputs.behind }}
        with:
          script: |
            const fs = require('fs');
            const { RESULT, BUILD_OUTCOME, UPSTREAM_SHA, BEHIND, TARGET_BRANCH, UPSTREAM_BRANCH } = process.env;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Upstream sync needs attention';
            let body;
            if (RESULT === 'conflict') {
              const files = fs.existsSync('/tmp/conflicts.md') ? fs.readFileSync('/tmp/conflicts.md', 'utf8') : '(none recorded)';
              body = `Merging \`upstream/${UPSTREAM_BRANCH}\` (${UPSTREAM_SHA}, ${BEHIND} commits) into \`${TARGET_BRANCH}\` conflicts in:\n\n${files}\nResolve locally:\n\n\`\`\`bash\ngit fetch upstream ${UPSTREAM_BRANCH}\ngit checkout ${TARGET_BRANCH}\ngit merge upstream/${UPSTREAM_BRANCH}\n\`\`\`\n\n[workflow run](${runUrl})`;
            } else {
              let log = fs.existsSync('/tmp/build.log') ? fs.readFileSync('/tmp/build.log', 'utf8') : '';
              const errors = log.split('\n').filter(l => /error [A-Z]+[0-9]+:/.test(l)).slice(0, 40).join('\n') || log.slice(-4000);
              body = `\`upstream/${UPSTREAM_BRANCH}\` (${UPSTREAM_SHA}, ${BEHIND} commits) merges cleanly into \`${TARGET_BRANCH}\` but the build fails, so nothing was pushed:\n\n\`\`\`\n${errors}\n\`\`\`\n\n[workflow run](${runUrl})`;
            }
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'upstream-sync', per_page: 5 });
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['upstream-sync'] });
            }
            core.setFailed(`${title}: ${RESULT === 'conflict' ? 'merge conflict' : 'build failed'}`);
