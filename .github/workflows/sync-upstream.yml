# Daily merge of FabianFG/CUE4Parse master into our uepacktool-fixes branch.
# Merged result is pushed only when the managed build still succeeds; a merge
# conflict or validation failure is recorded in the Actions summary; nothing is pushed.
name: Sync upstream

on:
  schedule:
    - cron: '0 20 * * *' # 04:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/FabianFG/CUE4Parse.git
  UPSTREAM_BRANCH: master
  TARGET_BRANCH: uepacktool-fixes

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Merge upstream
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upstream-sync"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          up=$(git rev-parse "upstream/$UPSTREAM_BRANCH")
          echo "upstream_sha=$up" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "already contains upstream/$UPSTREAM_BRANCH ($up)"
            echo "result=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(git rev-list --count "HEAD..upstream/$UPSTREAM_BRANCH")
          echo "behind=$n" >> "$GITHUB_OUTPUT"
          if git merge --no-ff --no-edit -m "Merge upstream/$UPSTREAM_BRANCH ($up, $n commits) into $TARGET_BRANCH" "upstream/$UPSTREAM_BRANCH"; then
            git submodule update --init --recursive
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            {
              git diff --name-only --diff-filter=U
              git diff --cc
            } > "$RUNNER_TEMP/upstream-sync/conflicts.log"
            if [[ -n "$(git ls-files -u)" ]]; then
              echo "result=conflict" >> "$GITHUB_OUTPUT"
            else
              echo "result=merge-error" >> "$GITHUB_OUTPUT"
            fi
            git merge --abort || true
          fi

      - name: Setup .NET
        id: setup
        if: steps.merge.outputs.result == 'merged'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build merged tree
        id: build
        if: steps.merge.outputs.result == 'merged'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          dotnet build CUE4Parse/CUE4Parse.csproj -c Release -nologo -clp:NoSummary 2>&1 | tee "$RUNNER_TEMP/upstream-sync/build.log"
          dotnet build CUE4Parse-Conversion/CUE4Parse-Conversion.csproj -c Release -nologo -clp:NoSummary 2>&1 | tee -a "$RUNNER_TEMP/upstream-sync/build.log"

      - name: Run parser regressions
        id: test
        if: steps.merge.outputs.result == 'merged' && steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --test .github/scripts/report-upstream-sync.test.cjs
          dotnet test CUE4Parse.Tests/CUE4Parse.Tests.csproj -c Release --filter 'FullyQualifiedName~UpstreamSyncRegressionTests' --logger 'console;verbosity=normal' 2>&1 | tee "$RUNNER_TEMP/upstream-sync/test.log"

      - name: Push merge
        id: push
        if: steps.merge.outputs.result == 'merged' && steps.build.outcome == 'success' && steps.test.outcome == 'success'
        shell: bash
        run: git push origin "HEAD:$TARGET_BRANCH"

      - name: Report sync result
        if: always()
        shell: bash
        env:
          RESULT: ${{ steps.merge.outputs.result }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          JOB_STATUS: ${{ job.status }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
          BEHIND: ${{ steps.merge.outputs.behind }}
        run: |
          if [[ -f .github/scripts/report-upstream-sync.cjs ]]; then
            node .github/scripts/report-upstream-sync.cjs
          else
            echo '## Upstream sync failed before reporting was available' >> "$GITHUB_STEP_SUMMARY"
            echo 'Check the checkout step and workflow logs for details.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
